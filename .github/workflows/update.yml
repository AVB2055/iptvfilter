name: Update IPTV Playlist

on:
  schedule:
    - cron: '0 */6 * * *'  # Запускать каждые 6 часов
  workflow_dispatch:       # Позволяет запускать вручную

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Разрешение на сохранение файлов
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run filter script
        run: python filter.py

      - name: Auto Commit and Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update: AVBTVfull.m3u refreshed"
          file_pattern: AVBTVfull.m3u
