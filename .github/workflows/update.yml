name: update iptv playlist

on:
  schedule:
    - cron: '0 23 * * *'  # Каждый день в 23:00 UTC (2:00 по Москве)
  workflow_dispatch:      # Ручной запуск

# Явно запрашиваем права на запись
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run python filter.py
        run: python filter.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add *.m3u
          
          if git diff --quiet && git diff --staged --quiet; then
            echo "✅ Изменений в плейлистах нет, коммит не требуется."
          else
            echo "📝 Найдены изменения, создаем коммит..."
            git commit -m "Auto-update IPTV playlists"
            # Используем имя текущей ветки автоматически (main или master)
            git push origin HEAD:${{ github.ref_name }}
          fi
